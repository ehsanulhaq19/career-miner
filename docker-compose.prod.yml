version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: careerminer-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: careerminer
      POSTGRES_APP_USER: admin
      POSTGRES_APP_PASSWORD: admin
    # Do not bind 0.0.0.0 — an exposed Postgres with default creds gets exploited within hours.
    # Backend reaches the DB via the docker network (db:5432). Localhost mapping is optional.
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-entrypoint-wrap.sh:/usr/local/bin/postgres-entrypoint-wrap.sh:ro
      - ./docker/postgres/ensure-app-user.sh:/usr/local/bin/ensure-app-user.sh:ro
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/postgres-entrypoint-wrap.sh"]
    command: ["postgres"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -U postgres -d careerminer -c 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: careerminer-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: /career-miner
        NEXT_PUBLIC_API_URL: https://imehsan.com/career-miner/api
    container_name: careerminer-frontend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BASE_PATH: /career-miner
      NEXT_PUBLIC_API_URL: https://imehsan.com/career-miner/api
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
